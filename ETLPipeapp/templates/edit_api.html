{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit API Source</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Edit API Source</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>API Name</label>

<input
type="text"
name="api_name"
class="form-control"
value="{{ api.api_name }}"
required>

</div>

<div class="mb-3">

<label>Base URL</label>

<input
type="url"
name="base_url"
class="form-control"
value="{{ api.base_url }}"
required>

</div>

<div class="mb-3">

<label>API Key</label>

<input
type="text"
name="api_key"
class="form-control"
value="{{ api.api_key }}"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select
name="status"
class="form-select">

<option value="Active"
{% if api.status == "Active" %}selected{% endif %}>
Active
</option>

<option value="Inactive"
{% if api.status == "Inactive" %}selected{% endif %}>
Inactive
</option>

</select>

</div>

<button
type="submit"
class="btn btn-success">

Update API

</button>

<a href="{% url 'api_sources' %}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>
</html>
