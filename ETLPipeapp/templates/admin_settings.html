{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Settings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.container-box{
    background:white;
    margin-top:40px;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 3px 12px rgba(0,0,0,.15);
}

h2{
    color:#0d6efd;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold"
href="{% url 'engineer_dashboard' %}">
Enterprise ETL
</a>

<button
class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link"
href="{% url 'engineer_dashboard' %}">
Dashboard
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="{% url 'api_sources' %}">
API Sources
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="{% url 'etl_jobs' %}">
ETL Jobs
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="{% url 'reports' %}">
Reports
</a>
</li>

<li class="nav-item">
<a class="nav-link active"
href="{% url 'admin_settings' %}">
Settings
</a>
</li>

<li class="nav-item">
<a class="nav-link"
href="{% url 'logout' %}">
Logout
</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container">

<div class="container-box">

<h2 class="text-center mb-4">

System Configuration

</h2>

{% if messages %}

{% for message in messages %}

<div class="alert alert-success">

{{ message }}

</div>

{% endfor %}

{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Default ETL Schedule

</label>

<select
name="schedule"
class="form-select">

<option>Daily</option>

<option>Weekly</option>

<option>Monthly</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Maximum Retry Count

</label>

<input
type="number"
class="form-control"
value="3">

</div>

<div class="mb-3">

<label class="form-label">

Notification Email

</label>

<input
type="email"
class="form-control"
placeholder="admin@example.com">

</div>

<div class="mb-3">

<label class="form-label">

Auto Synchronization

</label>

<select
class="form-select">

<option>Enabled</option>

<option>Disabled</option>

</select>

</div>

<button
type="submit"
class="btn btn-primary">

Save Settings

</button>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
