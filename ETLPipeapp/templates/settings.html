{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Settings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fa;
}

.settings-box{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="{% url 'engineer_dashboard' %}">
Enterprise ETL
</a>

<div class="navbar-nav ms-auto">

<a class="nav-link" href="{% url 'engineer_dashboard' %}">
Dashboard
</a>

<a class="nav-link active" href="{% url 'settings_page' %}">
Settings
</a>

<a class="nav-link" href="{% url 'logout' %}">
Logout
</a>

</div>

</div>

</nav>

<div class="settings-box">

<h2 class="text-center mb-4">
System Settings
</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Retry Count</label>

<input
type="number"
name="retry_count"
value="{{ settings.retry_count }}"
class="form-control">

</div>

<div class="mb-3">

<label>Batch Size</label>

<input
type="number"
name="batch_size"
value="{{ settings.batch_size }}"
class="form-control">

</div>

<div class="mb-3">

<label>Notification Email</label>

<input
type="email"
name="notification_email"
value="{{ settings.notification_email }}"
class="form-control">

</div>

<div class="mb-3">

<label>Schedule</label>

<select
name="schedule"
class="form-select">

<option {% if settings.schedule == "Daily" %}selected{% endif %}>Daily</option>
<option {% if settings.schedule == "Weekly" %}selected{% endif %}>Weekly</option>
<option {% if settings.schedule == "Monthly" %}selected{% endif %}>Monthly</option>

</select>

</div>

<div class="mb-3">

<label>Log Level</label>

<select
name="log_level"
class="form-select">

<option {% if settings.log_level == "INFO" %}selected{% endif %}>INFO</option>
<option {% if settings.log_level == "WARNING" %}selected{% endif %}>WARNING</option>
<option {% if settings.log_level == "ERROR" %}selected{% endif %}>ERROR</option>

</select>

</div>

<button
type="submit"
class="btn btn-primary w-100">

Save Settings

</button>

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
